spring:
  profiles:
    active: sit
  application:
    name: user_assistant #应用名称
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    property-naming-strategy: SNAKE_CASE
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    druid:
      filters: stat
      initial-size: 1
      max-active: 50
      max-open-prepared-statements: -1
      max-wait: 30000
      min-evictable-idle-time-millis: 300000
      min-idle: 1
      pool-prepared-statements: false
      remove-abandoned: true
      remove-abandoned-timeout-millis: 500000
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      web-stat-filter-exclusions: '*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*,/download/*,/wj/*,/assets/*'
      mapper:
        notEmpty: true

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  redis:
    redisson:
      enable: true
    timeout: 3000
    database: 0
    lettuce:
      pool:
        max-active: 500 # 连接池最大连接数（使用负值表示没有限制）,如果赋值为-1，则表示不限制；如果pool已经分配了maxActive个jedis实例，则此时pool的状态为exhausted(耗尽)
        max-idle: 100   # 连接池中的最大空闲连接 ，默认值也是8
        max-wait: 100 # # 等待可用连接的最大时间，单位毫秒，默认值为-1，表示永不超时。如果超过等待时间，则直接抛出JedisConnectionException
        min-idle: 100    # 连接池中的最小空闲连接 ，默认值也是0
      shutdown-timeout: 100ms
  cloud:
    service-registry:
      auto-registration:
        enabled: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
      enabled: true
      location: ${java.io.tmpdir}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8090
  config: classpath:logback-spring.xml
  tomcat:
    max-http-form-post-size: 10MB

upload:
  path: ${user.dir}/uploads
  url-prefix: /uploads
  allowed-types: image/jpeg,image/png,image/gif
  max-size: 2MB

logging:
  level:
    root: INFO
    com.module: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"