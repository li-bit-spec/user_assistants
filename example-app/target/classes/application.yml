server:
  port: 8080

# 用户助手配置
user-assistant:
  enabled: true  # 启用用户助手功能
  api-prefix: /api  # API路径前缀
  table-prefix: ass_  # 数据库表前缀
  enable-logging: true  # 启用日志记录
  
  # 文件上传配置
  upload:
    path: ${user.dir}/uploads  # 上传目录
    url-prefix: /uploads  # URL前缀
    allowed-types: image/jpeg,image/png,image/gif  # 允许的文件类型
    max-size: 2MB  # 最大文件大小
    max-request-size: 10MB  # 最大请求大小
  
  # Swagger配置
  swagger:
    enabled: true  # 启用Swagger文档
    title: 用户助手API  # 文档标题
    description: 用户助手系统接口文档  # 文档描述
    version: 1.0.0  # API版本
    base-package: com  # 扫描包路径（扫描com包下的所有Controller）

